<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06070a">
<title>Rellotge cronògraf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --lume:#dbe6c4;
    --lume-dark:#a9b891;
    --hand:#f0f2ee;
    --arrow:#e6402c;
    --accent:#c7d4a9;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{
    height:100%;
    background:#000;
  }
  body{
    margin:0; padding:0;
    position:fixed;
    inset:0;
    height:100dvh;
    width:100vw;
    background: radial-gradient(circle at 50% 22%, #16181c 0%, #06070a 65%, #000 100%);
    font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
  }

  /* ---- App shell: fills the screen, respects iOS safe areas ---- */
  .stage{
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    gap:clamp(10px,2.4vh,20px);
    padding-top:max(14px, env(safe-area-inset-top));
    padding-right:max(14px, env(safe-area-inset-right));
    padding-bottom:max(14px, env(safe-area-inset-bottom));
    padding-left:max(14px, env(safe-area-inset-left));
  }

  /* Portrait (default): watch takes almost the whole screen, calendar below */
  .watch-wrap{
    flex:1 1 auto;
    min-height:0;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---- Hourly flip mechanism: front (dial) / back (engraved plate) ---- */
  .watch-flip-wrap{
    position:relative;
    width:100%;
    height:100%;
    margin:auto;
    perspective:1800px;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,.65));
  }
  .watch-flip{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
  }
  .watch-flip.girant{
    /* Duration set per-trigger from JS (--gir-dur), since it varies with how
       many cuckoo+bell strikes have to fit inside the turn (1 to 12). */
    animation:girRellotge var(--gir-dur, 10s) cubic-bezier(.45,.05,.55,.95);
  }
  @keyframes girRellotge{
    from{ transform:rotateY(0deg); }
    to{ transform:rotateY(360deg); }
  }

  /* Silver/aluminum "edge" layer, only visible mid-spin as the disc turns side-on */
  .cos-cilindre-watch{
    position:absolute;
    inset:0;
    border-radius:50%;
    transform-style:preserve-3d;
    pointer-events:none;
  }
  .cos-cilindre-watch .capa-volum-watch{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 38% 32%,
      #fcfdfe 0%,
      #eef1f3 18%,
      #c3c9ce 42%,
      #8b9298 68%,
      #45484c 100%);
    box-shadow:inset 0 0 10px rgba(0,0,0,.6);
  }

  .cara-davant-watch, .cara-darrere-watch{
    position:absolute;
    inset:0;
    border-radius:50%;
    backface-visibility:hidden;
  }
  .cara-davant-watch{
    transform:translateZ(20px);
    cursor:pointer;
    /* Opaque backing so the Omega<->GAMA dial-swap (which shrinks to a
       thin edge-on sliver mid-turn) never turns this plate transparent:
       without it, the gap let the static outer hourly-flip cylinder
       (.cos-cilindre-watch, silver) show through behind it, which is
       what actually caused the "grey ball" mid-spin - not the dial's
       own cylinder. This backing is what should be seen filling that
       gap instead: a dark, faintly glossy bezel plate. */
    background:radial-gradient(circle at 30% 24%, #1e1e20 0%, #0b0b0c 45%, #000 100%);
  }
  /* Dedicated perspective wrapper for the inner dial-swap flip, structured
     exactly like .watch-flip-wrap -> .watch-flip (a plain perspective box
     with a single preserve-3d child) so it rotates through the SAME kind
     of 3D system as the hourly front/back turn, instead of being nested
     several preserve-3d levels deep where perspective behaves oddly. */
  .dial-flip-wrap{
    position:absolute;
    inset:0;
    perspective:1800px;
  }
  .cara-davant-watch svg{
    width:100%;
    height:100%;
    display:block;
  }
  /* Inner flip, independent of the hourly front/back turn: tapping the
     dial swaps between the Omega face and the GAMA chronometer replica,
     sharing the exact same chronograph state so either face always shows
     the run in progress. */
  .dial-flip{
    position:absolute;
    inset:0;
    border-radius:50%;
    transform-style:preserve-3d;
    transition:transform 2.4s cubic-bezier(.45,.05,.55,.95);
  }
  .dial-flip.mostra-gama{
    transform:rotateY(180deg);
  }
  /* Same layered-disc "volume" edge as the hourly flip (.cos-cilindre-watch),
     scaled down to a thin dial's worth of thickness: a stack of slightly
     Z-offset discs so the turning dial always has something angled toward
     the camera mid-spin, instead of vanishing edge-on like a flat CSS
     rotateY would. Sits inside .dial-flip so it inherits its rotation. */
  .dial-cilindre-watch{
    position:absolute;
    inset:0;
    border-radius:50%;
    transform-style:preserve-3d;
    pointer-events:none;
  }
  .dial-cilindre-watch .capa-volum-dial{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:#050505;
  }
  .dial-face{
    position:absolute;
    inset:0;
    border-radius:50%;
    backface-visibility:hidden;
    /* Sits just in front of .dial-cilindre-watch's thin z-range (+-7px) so
       the layered edge only shows through mid-turn, not at rest. */
    transform:translateZ(8px);
  }
  .dial-face-gama{
    transform:rotateY(180deg) translateZ(8px);
  }
  .cara-darrere-watch{
    transform:rotateY(180deg) translateZ(20px);
    background:radial-gradient(circle at 34% 30%,
      #f6f7f8 0%,
      #dde1e4 24%,
      #b4bac0 50%,
      #7d838a 76%,
      #45474b 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:inset 0 0 26px rgba(0,0,0,.35);
  }
  .gravat-revers{
    text-align:center;
    font-family:'Jost','Poppins',-apple-system,sans-serif;
    text-transform:lowercase;
    color:#4a4e52;
    line-height:1.5;
  }
  .gravat-revers .nom{
    display:block;
    font-size:clamp(20px, 7.6vw, 36px);
    font-weight:400;
    letter-spacing:.09em;
    color:#3c3f43;
    text-shadow:0 1px 0 rgba(255,255,255,.55), 0 -1px 1px rgba(0,0,0,.18);
  }
  .gravat-revers .signat{
    display:block;
    margin-top:.35em;
    font-size:clamp(14px, 5vw, 23px);
    font-weight:300;
    letter-spacing:.32em;
    color:#6b6f74;
    text-shadow:0 1px 0 rgba(255,255,255,.5), 0 -1px 1px rgba(0,0,0,.15);
  }

  .calendar{
    flex:0 0 auto;
    width:100%;
    max-width:420px;
    margin:0 auto;
    background:linear-gradient(180deg,#141516,#0b0c0d);
    border:1px solid #232426;
    border-radius:16px;
    padding:clamp(10px,2vh,16px) clamp(10px,3vw,14px) clamp(12px,2vh,18px);
    box-shadow:0 20px 40px -12px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.03);
  }
  /* Chronograph pushers: real mounted pusher shape — a stubby capsule that
     merges into the case at its base and rotates radially so it reads as
     bolted onto the bezel at ~10 and ~2 o'clock, like on an actual
     chronograph, rather than a free-floating round button. The green
     "today" accent lives in the cap face, with a steel collar at the base
     for the mounted look. */
  .crono-btn{
    position:absolute;
    z-index:5;
    top:18.1%;
    width:clamp(18px,4.5vw,25px);
    height:clamp(36px,9vw,50px);
    border-radius:46% 46% 5px 5px;
    border:1px solid #4b5540;
    background:
      linear-gradient(180deg, var(--accent) 0%, var(--accent) 62%, #6d7a5a 72%, #3a3d40 82%, #767b7f 92%, #26282a 100%);
    box-shadow:
      0 3px 6px rgba(0,0,0,.6),
      0 1px 0 rgba(255,255,255,.3) inset,
      0 -2px 3px rgba(0,0,0,.4) inset;
    padding:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:filter .08s ease, box-shadow .08s ease;
  }
  .crono-btn:active{
    filter:brightness(0.88);
    box-shadow:
      0 1px 2px rgba(0,0,0,.55),
      0 1px 0 rgba(255,255,255,.18) inset,
      0 -1px 2px rgba(0,0,0,.45) inset;
  }
  .crono-btn.is-active{
    box-shadow:
      0 0 0 2px rgba(199,212,169,.6),
      0 3px 6px rgba(0,0,0,.6),
      0 1px 0 rgba(255,255,255,.3) inset,
      0 -2px 3px rgba(0,0,0,.4) inset;
  }
  .crono-btn-left, .crono-btn-right{
    transition:transform .4s ease, filter .08s ease, box-shadow .08s ease;
  }
  .crono-btn-left{
    left:13.8%;
    transform:translate(-50%,-50%) rotate(-48.6deg);
  }
  .crono-btn-left:active{ transition:transform .08s ease, filter .08s ease, box-shadow .08s ease; transform:translate(-50%,-50%) rotate(-48.6deg) scale(0.93); }
  .crono-btn-left.pusher-retreat{ transform:translate(-50%,-50%) rotate(-48.6deg) translateY(-22px); }
  .crono-btn-right{
    left:86.2%;
    transform:translate(-50%,-50%) rotate(48.6deg);
  }
  .crono-btn-right:active{ transition:transform .08s ease, filter .08s ease, box-shadow .08s ease; transform:translate(-50%,-50%) rotate(48.6deg) scale(0.93); }
  .crono-btn-right.pusher-retreat{ transform:translate(-50%,-50%) rotate(48.6deg) translateY(-22px); }

  /* Same pushers, same shape — recoloured to the GAMA replica's own red
     (left) / black (right) chromatism while that face is showing. */
  .mode-gama .crono-btn-left{
    border-color:#5c2018;
    background:
      linear-gradient(180deg, #e6402c 0%, #e6402c 62%, #8a2a1f 72%, #3a3d40 82%, #767b7f 92%, #26282a 100%);
  }
  .mode-gama .crono-btn-right{
    border-color:#111214;
    background:
      linear-gradient(180deg, #35373a 0%, #2a2c2e 62%, #1a1b1c 72%, #3a3d40 82%, #767b7f 92%, #26282a 100%);
  }
  .mode-gama .crono-btn.is-active{
    box-shadow:
      0 0 0 2px rgba(230,64,44,.65),
      0 3px 6px rgba(0,0,0,.6),
      0 1px 0 rgba(255,255,255,.3) inset,
      0 -2px 3px rgba(0,0,0,.4) inset;
  }
  .cal-header{
    text-align:center;
    color:#e6e6e2;
    font-size:clamp(13px,2.6vh,19px);
    letter-spacing:.12em;
    text-transform:uppercase;
    margin-bottom:clamp(6px,1.4vh,12px);
    font-weight:700;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:clamp(2px,0.6vh,4px);
  }
  .cal-dow{
    text-align:center;
    color:#8b9482;
    font-size:clamp(10px,2vh,14.5px);
    letter-spacing:.06em;
    font-weight:700;
    padding-bottom:clamp(2px,0.8vh,6px);
  }
  .cal-day{
    text-align:center;
    color:#c7ccc2;
    font-size:clamp(11px,2.3vh,18px);
    font-weight:700;
    padding:clamp(2px,0.9vh,6px) 0;
    border-radius:8px;
  }
  .cal-day.empty{ color:transparent; }
  /* Weekends: a faint tint, distinct from an ordinary weekday. */
  .cal-day.weekend{ background:rgba(255,255,255,.045); color:#d7dbce; }
  /* Public holidays (state + Catalan + local Barcelona festius): the same
     red used for the chronograph hands elsewhere on the dial. */
  .cal-day.holiday{ color:var(--arrow); }
  /* Today: an outlined ring in the green accent rather than a solid fill,
     so it stays legible layered together with the weekend/holiday tint
     or color underneath it. */
  .cal-day.today{
    color:var(--accent);
    font-weight:700;
    box-shadow:0 0 0 2px var(--accent) inset;
  }
  .cal-day.today.holiday{ color:var(--arrow); }
  /* Swipe left/right to browse two months back and two ahead. */
  .calendar{ touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  /* The month sliding in/out briefly sticks out sideways; clip it so the
     card never grows a horizontal scrollbar (the white strip + jump seen
     on desktop browsers with always-visible scrollbars). */
  .calendar{ overflow-x:hidden; overflow-x:clip; }
  .cal-header, .cal-grid{
    transition:transform .2s ease, opacity .2s ease;
  }
  .cal-header.lliscant, .cal-grid.lliscant{ transition:none; }
  .cal-header.fora-esq, .cal-grid.fora-esq{ transform:translateX(-28px); opacity:0; }
  .cal-header.fora-dre, .cal-grid.fora-dre{ transform:translateX(28px); opacity:0; }
  /* double-tap the month name to jump back to the current month */
  .cal-header{ touch-action:manipulation; cursor:default; }
  .cal-avui-fila{
    display:flex;
    justify-content:center;
    margin-top:clamp(6px,1.2vh,10px);
    min-height:26px;
  }
  .cal-avui{
    font:inherit;
    font-size:clamp(10.5px,1.8vh,12.5px);
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    background:rgba(199,212,169,.08);
    border:1px solid rgba(199,212,169,.45);
    border-radius:999px;
    padding:4px 12px;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:opacity .2s ease, background .15s ease;
  }
  .cal-avui:hover{ background:rgba(199,212,169,.16); }
  .cal-avui:active{ background:rgba(199,212,169,.24); }
  /* hidden (but still taking its place) while showing the current month,
     so the card never changes height */
  .cal-avui.amagat{ visibility:hidden; opacity:0; }
  /* Tap a festiu to see which holiday it is; tap it again to close. */
  .cal-grid{ position:relative; }
  .cal-day.holiday{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .cal-day.holiday.selected{ background:rgba(230,64,44,.16); }
  .cal-festa-pop{
    position:absolute;
    z-index:10;
    left:0; top:0;
    width:max-content;
    max-width:calc(100% - 4px);
    box-sizing:border-box;
    padding:7px 11px 8px;
    border-radius:9px;
    background:linear-gradient(180deg,#1f2022,#161719);
    border:1px solid rgba(230,64,44,.75);
    box-shadow:0 10px 24px -6px rgba(0,0,0,.8);
    color:#ecece8;
    text-align:center;
    pointer-events:none;
    opacity:0;
    transform:translateY(4px) scale(.96);
    transition:opacity .18s ease, transform .18s ease;
  }
  .cal-festa-pop.visible{ opacity:1; transform:none; }
  .cal-festa-pop .nom{
    display:block;
    font-size:clamp(11.5px,2vh,14px);
    font-weight:700;
    line-height:1.25;
  }
  .cal-festa-pop .tipus{
    display:block;
    margin-top:2px;
    font-size:clamp(9.5px,1.6vh,11.5px);
    color:#9aa392;
    letter-spacing:.04em;
  }
  /* little pointer towards the tapped day */
  .cal-festa-pop::after{
    content:'';
    position:absolute;
    left:var(--punta-x, 50%);
    bottom:-6px;
    width:10px; height:10px;
    margin-left:-5px;
    background:#161719;
    border-right:1px solid rgba(230,64,44,.75);
    border-bottom:1px solid rgba(230,64,44,.75);
    transform:rotate(45deg);
  }
  .cal-festa-pop.sota::after{
    bottom:auto; top:-6px;
    background:#1f2022;
    transform:rotate(225deg);
  }
  .cal-location{
    text-align:center;
    color:#8b9482;
    font-size:clamp(10px,2vh,12.5px);
    letter-spacing:.08em;
    margin-top:clamp(8px,1.6vh,12px);
    padding-top:clamp(8px,1.6vh,12px);
    border-top:1px solid #232426;
    font-variant-numeric:tabular-nums;
  }

  /* ---- Landscape: calendar moves to the right, watch on the left, everything fits ---- */
  @media (orientation:landscape){
    .stage{
      flex-direction:row;
      align-items:stretch;
      justify-content:center;
    }
    .watch-wrap{
      flex:1 1 auto;
      height:100%;
    }
    .calendar{
      flex:0 0 auto;
      width:clamp(200px, 30vw, 360px);
      max-width:none;
      height:100%;
      margin:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      overflow-y:auto;
    }
  }

  /* Tasteful caps on larger screens so the watch doesn't become oversized */
  @media (orientation:landscape) and (min-width:900px){
    .watch-wrap{ max-width:min(60vw, 640px); }
    .calendar{ width:min(30vw, 380px); }
  }
  @media (orientation:portrait) and (min-height:900px){
    .watch-wrap{ max-height:min(62vh, 620px); }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="watch-wrap">
   <div class="watch-flip-wrap" id="watchFlipWrap">
    <button type="button" class="crono-btn crono-btn-left" id="cronoSplitBtn" aria-label="Posa a zero o marca volta"></button>
    <button type="button" class="crono-btn crono-btn-right" id="cronoStartBtn" aria-label="Engega o atura el cronòmetre"></button>
    <div class="watch-flip" id="watchFlip">
     <div class="cos-cilindre-watch" id="cosCilindreWatch"></div>
     <div class="cara-davant-watch">
      <div class="dial-flip-wrap" id="dialFlipWrap">
       <div class="dial-flip" id="dialFlip">
        <div class="dial-cilindre-watch" id="dialCilindre"></div>
       <div class="dial-face dial-face-omega">
        <svg id="watchSvg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="caseGrad" cx="35%" cy="28%" r="75%">
          <stop offset="0%" stop-color="#f1f3f5"/>
          <stop offset="45%" stop-color="#adb4ba"/>
          <stop offset="80%" stop-color="#5c6267"/>
          <stop offset="100%" stop-color="#2b2e31"/>
        </radialGradient>
        <radialGradient id="dialGrad" cx="40%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#1e1f22"/>
          <stop offset="55%" stop-color="#101113"/>
          <stop offset="100%" stop-color="#020203"/>
        </radialGradient>
        <radialGradient id="subGrad" cx="38%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#232427"/>
          <stop offset="60%" stop-color="#18191b"/>
          <stop offset="100%" stop-color="#0a0a0b"/>
        </radialGradient>
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3a3d40"/>
          <stop offset="45%" stop-color="#d8dcdf"/>
          <stop offset="70%" stop-color="#767b7f"/>
          <stop offset="100%" stop-color="#26282a"/>
        </linearGradient>
        <linearGradient id="lumeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--lume)"/>
          <stop offset="100%" stop-color="var(--lume-dark)"/>
        </linearGradient>
        <radialGradient id="pivotGrad" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#f2f2f2"/>
          <stop offset="60%" stop-color="#7d7d7d"/>
          <stop offset="100%" stop-color="#242424"/>
        </radialGradient>
        <radialGradient id="bezelSheen" cx="30%" cy="20%" r="80%">
          <stop offset="0%" stop-color="#2a2a2a"/>
          <stop offset="60%" stop-color="#0c0c0c"/>
          <stop offset="100%" stop-color="#000"/>
        </radialGradient>
        <filter id="concave" x="-50%" y="-50%" width="200%" height="200%">
          <feOffset in="SourceGraphic" dx="1.6" dy="2.2" result="off1"/>
          <feGaussianBlur in="off1" stdDeviation="2.4" result="blur1"/>
          <feComposite operator="out" in="SourceGraphic" in2="blur1" result="inv1"/>
          <feFlood flood-color="#000000" flood-opacity="0.75" result="col1"/>
          <feComposite operator="in" in="col1" in2="inv1" result="shadowDark"/>

          <feOffset in="SourceGraphic" dx="-1" dy="-1.4" result="off2"/>
          <feGaussianBlur in="off2" stdDeviation="1.6" result="blur2"/>
          <feComposite operator="out" in="SourceGraphic" in2="blur2" result="inv2"/>
          <feFlood flood-color="#ffffff" flood-opacity="0.08" result="col2"/>
          <feComposite operator="in" in="col2" in2="inv2" result="shadowLight"/>

          <feMerge>
            <feMergeNode in="SourceGraphic"/>
            <feMergeNode in="shadowDark"/>
            <feMergeNode in="shadowLight"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Steel case -->
      <circle cx="200" cy="200" r="193" fill="url(#caseGrad)"/>
      <circle cx="200" cy="200" r="193" fill="none" stroke="#1b1c1e" stroke-width="1"/>
      <g id="caseFlutes" stroke="#7d8286" stroke-width="1" opacity="0.35"></g>

      <!-- Bezel insert -->
      <circle cx="200" cy="200" r="179" fill="url(#bezelSheen)"/>
      <circle cx="200" cy="200" r="179" fill="none" stroke="#000" stroke-width="1"/>

      <!-- Tachymeter: minor ticks first, then major numbers on top -->
      <g id="tachyMinorTicks" stroke="#666" stroke-width="0.7" opacity="0.75"></g>
      <g id="tachyMajorTicks" stroke="#cfcfcf" stroke-width="1" opacity="0.85"></g>
      <g id="tachyGroup" font-size="10" font-weight="600" fill="#d6d6d6" font-family="Helvetica Neue, Arial, sans-serif"></g>

<script>
(function(){
  const CX = 200, CY = 200;
  const NS = 'http://www.w3.org/2000/svg';

  function polar(angleDeg, r){
    const rad = angleDeg * Math.PI/180;
    return [CX + r*Math.sin(rad), CY - r*Math.cos(rad)];
  }
  function polarFrom(cx, cy, angleDeg, r){
    const rad = angleDeg * Math.PI/180;
    return [cx + r*Math.sin(rad), cy - r*Math.cos(rad)];
  }
  function tangent(angleDeg){
    const rad = angleDeg * Math.PI/180;
    return [Math.cos(rad), Math.sin(rad)];
  }

  // ---- Tachymeter: physically accurate scale ----
  // angle for a given value: value = 3600/t(seconds), one full turn = 60s -> angle = 6*t = 21600/value
  const tachyValues = [60,65,70,75,80,85,90,100,110,120,130,140,150,160,170,180,190,200,225,250,275,300,350,400,500];
  const tachyGroup = document.getElementById('tachyGroup');
  const tachyMajorTicks = document.getElementById('tachyMajorTicks');
  const tachyMinorTicks = document.getElementById('tachyMinorTicks');

  tachyValues.forEach(val=>{
    const angle = 21600/val;
    const [x,y] = polar(angle, 163);
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x', x.toFixed(2));
    t.setAttribute('y', y.toFixed(2));
    t.setAttribute('text-anchor','middle');
    t.setAttribute('dominant-baseline','middle');
    t.setAttribute('transform', `rotate(${angle.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)})`);
    t.textContent = val;
    tachyGroup.appendChild(t);

    const [x1,y1] = polar(angle, 176);
    const [x2,y2] = polar(angle, 171);
    const l = document.createElementNS(NS,'line');
    l.setAttribute('x1',x1.toFixed(2)); l.setAttribute('y1',y1.toFixed(2));
    l.setAttribute('x2',x2.toFixed(2)); l.setAttribute('y2',y2.toFixed(2));
    tachyMajorTicks.appendChild(l);
  });

  // minor ticks: every whole second from 8 to 59 (skip where a major tick already sits)
  const majorAngles = new Set(tachyValues.map(v => Math.round((21600/v)*10)));
  for(let t=8; t<60; t++){
    const angle = 6*t;
    const rounded = Math.round(angle*10);
    if(majorAngles.has(rounded)) continue;
    const [x1,y1] = polar(angle, 176);
    const [x2,y2] = polar(angle, 172.5);
    const l = document.createElementNS(NS,'line');
    l.setAttribute('x1',x1.toFixed(2)); l.setAttribute('y1',y1.toFixed(2));
    l.setAttribute('x2',x2.toFixed(2)); l.setAttribute('y2',y2.toFixed(2));
    tachyMinorTicks.appendChild(l);
  }

  // ---- Case flutes ----
  const caseFlutes = document.getElementById('caseFlutes');
  for(let i=0;i<60;i++){
    const angle = i*6;
    const [x1,y1] = polar(angle, 191);
    const [x2,y2] = polar(angle, 186);
    const l = document.createElementNS(NS,'line');
    l.setAttribute('x1',x1.toFixed(2)); l.setAttribute('y1',y1.toFixed(2));
    l.setAttribute('x2',x2.toFixed(2)); l.setAttribute('y2',y2.toFixed(2));
    caseFlutes.appendChild(l);
  }

  // ---- Minute ticks ----
  const ticksGroup = document.getElementById('ticksGroup');
  for(let i=0;i<60;i++){
    if(i % 5 === 0) continue;
    const angle = i*6;
    const [x1,y1] = polar(angle, 147);
    const [x2,y2] = polar(angle, 140);
    const l = document.createElementNS(NS,'line');
    l.setAttribute('x1',x1.toFixed(2)); l.setAttribute('y1',y1.toFixed(2));
    l.setAttribute('x2',x2.toFixed(2)); l.setAttribute('y2',y2.toFixed(2));
    ticksGroup.appendChild(l);
  }

  // ---- Hour markers (explicit polygons) ----
  const markersGroup = document.getElementById('markersGroup');
  for(let i=0;i<12;i++){
    const angle = i*30;
    const isTwelve = i===0;
    const nearSub = (i===3 || i===6 || i===9);
    const outerR = 147;
    const len = isTwelve ? 24 : (nearSub ? 20 : 13);
    const innerR = outerR - len;
    const hw = (isTwelve ? 4 : 3);
    const [tx,ty] = tangent(angle);
    const [ox,oy] = polar(angle, outerR);
    const [ix,iy] = polar(angle, innerR);
    const p1 = [ox - tx*hw, oy - ty*hw];
    const p2 = [ox + tx*hw, oy + ty*hw];
    const p3 = [ix + tx*hw, iy + ty*hw];
    const p4 = [ix - tx*hw, iy - ty*hw];
    const poly = document.createElementNS(NS,'polygon');
    poly.setAttribute('points', [p1,p2,p3,p4].map(p=>p.map(v=>v.toFixed(2)).join(',')).join(' '));
    markersGroup.appendChild(poly);
  }

  // ---- Subdial tick marks ----
  // `count` = how many divisions make a full turn of the hand on that
  // subdial (12 for the decorative left/right dials). `majorEvery`, when
  // given, draws a longer tick every N divisions so a fine scale (e.g. the
  // 30-minute chronograph totalizer) stays readable.
  function drawSubTicks(groupId, cx, cy, r, count, majorEvery){
    count = count || 12;
    const g = document.getElementById(groupId);
    for(let i=0;i<count;i++){
      const angle = i*(360/count);
      const rad = angle * Math.PI/180;
      const isMajor = majorEvery ? (i % majorEvery === 0) : true;
      const inset = isMajor ? 4 : 2.4;
      const x1 = cx + (r-inset)*Math.sin(rad), y1 = cy - (r-inset)*Math.cos(rad);
      const x2 = cx + r*Math.sin(rad), y2 = cy - r*Math.cos(rad);
      const l = document.createElementNS(NS,'line');
      l.setAttribute('x1',x1.toFixed(2)); l.setAttribute('y1',y1.toFixed(2));
      l.setAttribute('x2',x2.toFixed(2)); l.setAttribute('y2',y2.toFixed(2));
      if(!isMajor) l.setAttribute('stroke-width','0.5');
      g.appendChild(l);
    }
  }
  drawSubTicks('subLeftTicks', 140, 200, 33, 12);
  drawSubTicks('subRightTicks', 260, 200, 33, 12);
  // Chronograph minute totalizer: 30 divisions per revolution (matching
  // cronoMin*12 in frame()), with a major tick every 5 minutes.
  drawSubTicks('subBottomTicks', 200, 259, 32, 30, 5);

  // Numerals at every 5-minute major tick of the chronograph totalizer.
  function drawSubNumbers(groupId, cx, cy, r, totalCount, values){
    const g = document.getElementById(groupId);
    values.forEach(v => {
      const angle = v * (360/totalCount);
      const rad = angle * Math.PI/180;
      const x = cx + r*Math.sin(rad);
      const y = cy - r*Math.cos(rad);
      const t = document.createElementNS(NS,'text');
      t.setAttribute('x', x.toFixed(2));
      t.setAttribute('y', (y+2.6).toFixed(2));
      t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','7.5');
      t.setAttribute('fill','#8f9a86');
      t.textContent = v;
      g.appendChild(t);
    });
  }
  drawSubNumbers('subBottomNumbers', 200, 259, 24, 30, [5,10,15,20,25]);

  // ---- Live hands ----
  const hourHand = document.getElementById('hourHand');
  const minHand = document.getElementById('minHand');
  const secHand = document.getElementById('secHand');
  const chronoHand = document.getElementById('chronoHand');
  const chronoMinHand = document.getElementById('cronoMinHand');
  // Same two hands, redrawn on the GAMA face — driven by the identical
  // angles every frame, so the two faces are always perfectly in sync
  // whichever one happens to be showing.
  const chronoHandGama = document.getElementById('chronoHandGama');
  const cronoMinHandGama = document.getElementById('cronoMinHandGama');

  // ---- Chronograph (classic two-pusher mechanism) -------------------------
  // Left pusher: start/stop. Right pusher: while running, first press
  // freezes the hands (a "split" reading) though the chronograph keeps
  // timing underneath; a second press releases the hands, which jump
  // straight to the live elapsed time and keep going. While stopped, the
  // right pusher resets everything to zero.
  let cronoRunning = false;
  let cronoElapsedMs = 0;      // accumulated time while not currently running
  let cronoStartedAt = 0;      // performance.now() at the last start/resume
  let cronoHandsFrozen = false;
  let cronoFrozenMs = 0;

  // Eased return-to-zero tweens for the reset gesture: each is
  // {from, to, dur, start} in degrees / ms (performance.now() based).
  // Before the midpoint of its course, the hand retraces its own path
  // backward (counter-clockwise) straight to 0. Past the midpoint, it
  // keeps going forward (clockwise), completing the lap it was already
  // making, back around to 0/360.
  let cronoSecAnim = null;
  let cronoMinAnim = null;
  const CRONO_RESET_SPEED = 110; // deg/s — "lentament"

  function cronoLiveElapsedMs(){
    return cronoElapsedMs + (cronoRunning ? performance.now() - cronoStartedAt : 0);
  }

  const cronoStartBtn = document.getElementById('cronoStartBtn');
  const cronoSplitBtn = document.getElementById('cronoSplitBtn');

  cronoStartBtn.addEventListener('click', () => {
    cronoSecAnim = null;
    cronoMinAnim = null;
    if(cronoRunning){
      // Stop: bank the elapsed time and always reveal the true reading,
      // even if the hands happened to be frozen on a split at that moment.
      cronoElapsedMs = cronoLiveElapsedMs();
      cronoRunning = false;
      cronoHandsFrozen = false;
      cronoStartBtn.classList.remove('is-active');
    } else {
      cronoStartedAt = performance.now();
      cronoRunning = true;
      cronoHandsFrozen = false;
      cronoStartBtn.classList.add('is-active');
    }
  });

  cronoSplitBtn.addEventListener('click', () => {
    if(cronoRunning){
      if(!cronoHandsFrozen){
        cronoSecAnim = null;
        cronoMinAnim = null;
        cronoFrozenMs = cronoLiveElapsedMs();
        cronoHandsFrozen = true;
      } else {
        // Release: instead of a sudden jump, sweep the hands forward from
        // the frozen split reading up to the live reading, at the same
        // "lentament" speed as the return-to-zero — but since the
        // chronograph keeps running underneath, the live reading is a
        // moving target. Solve for the duration T where the fast catch-up
        // hand (at CRONO_RESET_SPEED) meets the still-advancing live hand
        // (at its normal speed) exactly: T = gap / (catchupSpeed - liveSpeed).
        const SEC_SPEED = 6;        // deg/s a live seconds hand advances
        const MIN_SPEED = 12 / 60;  // deg/s a live totalizer minute hand advances
        const liveMs = cronoLiveElapsedMs();

        const fromSecDeg = (cronoFrozenMs/1000) * 6;         // unbounded, no modulo
        const liveSecDeg = (liveMs/1000) * 6;
        const gapSec = liveSecDeg - fromSecDeg;
        if(gapSec > 0.05){
          const Tsec = gapSec / (CRONO_RESET_SPEED - SEC_SPEED);
          cronoSecAnim = { from: fromSecDeg, to: fromSecDeg + CRONO_RESET_SPEED*Tsec, dur: Tsec*1000, start: performance.now() };
        } else {
          cronoSecAnim = null;
        }

        const fromMinDeg = (cronoFrozenMs/1000/60) * 12;     // unbounded, no modulo
        const liveMinDeg = (liveMs/1000/60) * 12;
        const gapMin = liveMinDeg - fromMinDeg;
        if(gapMin > 0.05){
          const Tmin = gapMin / (CRONO_RESET_SPEED - MIN_SPEED);
          cronoMinAnim = { from: fromMinDeg, to: fromMinDeg + CRONO_RESET_SPEED*Tmin, dur: Tmin*1000, start: performance.now() };
        } else {
          cronoMinAnim = null;
        }

        cronoHandsFrozen = false;
      }
    } else {
      cronoSecAnim = null;
      cronoMinAnim = null;
      const curSec = (cronoElapsedMs/1000) % 60;
      const curMin = (cronoElapsedMs/1000/60) % 30;
      const curSecDeg = curSec*6;
      const curMinDeg = curMin*12;

      const secTo = (curSec < 30) ? 0 : 360;
      const secTravel = Math.abs(secTo - curSecDeg);
      cronoSecAnim = { from: curSecDeg, to: secTo, dur: Math.max(250, secTravel/CRONO_RESET_SPEED*1000), start: performance.now() };

      const minTo = (curMin <= 15) ? 0 : 360;
      const minTravel = Math.abs(minTo - curMinDeg);
      cronoMinAnim = { from: curMinDeg, to: minTo, dur: Math.max(250, minTravel/CRONO_RESET_SPEED*1000), start: performance.now() };

      cronoElapsedMs = 0;
      cronoHandsFrozen = false;
      cronoFrozenMs = 0;
    }
  });

  function frame(){
    const now = new Date();
    const s = now.getSeconds() + now.getMilliseconds()/1000;
    const m = now.getMinutes() + s/60;
    const h = (now.getHours()%12) + m/60;

    const secDeg = s*6;
    const minDeg = m*6;
    const hourDeg = h*30;

    hourHand.setAttribute('transform', `translate(${CX} ${CY}) rotate(${hourDeg})`);
    minHand.setAttribute('transform', `translate(${CX} ${CY}) rotate(${minDeg})`);
    secHand.setAttribute('transform', `translate(${CX} ${CY}) rotate(${secDeg})`);

    const displayMs = cronoHandsFrozen ? cronoFrozenMs : cronoLiveElapsedMs();

    let cronoSecDeg;
    if(cronoSecAnim){
      const t = Math.min(1, (performance.now() - cronoSecAnim.start) / cronoSecAnim.dur);
      cronoSecDeg = cronoSecAnim.from + (cronoSecAnim.to - cronoSecAnim.from)*t;
      if(t >= 1) cronoSecAnim = null;
    } else {
      cronoSecDeg = ((displayMs/1000) % 60) * 6;
    }

    let cronoMinDeg;
    if(cronoMinAnim){
      const t = Math.min(1, (performance.now() - cronoMinAnim.start) / cronoMinAnim.dur);
      cronoMinDeg = cronoMinAnim.from + (cronoMinAnim.to - cronoMinAnim.from)*t;
      if(t >= 1) cronoMinAnim = null;
    } else {
      cronoMinDeg = ((displayMs/1000/60) % 30) * 12;
    }

    chronoHand.setAttribute('transform', `translate(${CX} ${CY}) rotate(${cronoSecDeg})`);
    chronoMinHand.setAttribute('transform', `translate(200 259) rotate(${cronoMinDeg})`);
    if(chronoHandGama) chronoHandGama.setAttribute('transform', `translate(200.2 195.3) rotate(${cronoSecDeg})`);
    if(cronoMinHandGama) cronoMinHandGama.setAttribute('transform', `translate(199.6 118.7) rotate(${cronoMinDeg})`);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- Altimeter (right subdial) + Temperature (left subdial) + Location, from device location ----
  const altValue = document.getElementById('altValue');
  const tempValue = document.getElementById('tempValue');
  const calLocation = document.getElementById('calLocation');
  let lastTempFetch = 0;
  let lastLocFetch = 0;

  if('geolocation' in navigator){
    navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude, altitude } = pos.coords;
        altValue.textContent = (altitude === null || altitude === undefined) ? 'S/D' : Math.round(altitude);

        const now = Date.now();
        if(now - lastTempFetch > 5*60*1000){
          lastTempFetch = now;
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`)
            .then(r => r.json())
            .then(data => {
              const t = data && data.current_weather ? data.current_weather.temperature : null;
              tempValue.textContent = (t === null || t === undefined) ? 'S/D' : Math.round(t);
            })
            .catch(() => { tempValue.textContent = 'S/D'; });
        }

        if(now - lastLocFetch > 5*60*1000){
          lastLocFetch = now;
          fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=ca`)
            .then(r => r.json())
            .then(data => {
              const town = data && (data.locality || data.city || data.principalSubdivision);
              const country = data && data.countryName;
              const subdivision = data && data.principalSubdivision;
              const catalanCountries = ['Catalunya','Comunitat Valenciana','País Valencià','Illes Balears'];
              const region = (data && data.countryCode === 'ES' && catalanCountries.includes(subdivision))
                ? subdivision
                : country;
              calLocation.textContent = town ? (region ? `${town}, ${region}` : town) : 'S/D';
            })
            .catch(() => { calLocation.textContent = 'S/D'; });
        }
      },
      () => { altValue.textContent = 'S/D'; tempValue.textContent = 'S/D'; calLocation.textContent = 'S/D'; },
      { enableHighAccuracy:true, maximumAge:5000, timeout:10000 }
    );
  } else {
    altValue.textContent = 'S/D';
    tempValue.textContent = 'S/D';
    calLocation.textContent = 'S/D';
  }

  // ---- Month calendar (Monday-Sunday): today, weekends and festius each
  // get their own distinct highlight ----
  const monthNames = ['GENER','FEBRER','MARÇ','ABRIL','MAIG','JUNY','JULIOL','AGOST','SETEMBRE','OCTUBRE','NOVEMBRE','DESEMBRE'];
  const dow = ['DL','DT','DC','DJ','DV','DS','DG'];

  // ---- Public holidays: state + Catalan regional (Generalitat's open-data
  // "Calendari laboral de Catalunya") + Barcelona local festius (its
  // "Calendari de festes locals a Catalunya", filtered to Barcelona). Both
  // are Socrata/CORS-enabled endpoints, fetched fresh on every page load;
  // if that fails (offline, blocked, dataset not yet published for a
  // future year) it falls back to this embedded list instead of showing
  // nothing.
  const FESTIUS_FALLBACK = {
    2026: ['2026-01-01','2026-01-06','2026-04-03','2026-04-06','2026-05-01','2026-05-25','2026-06-24','2026-08-15','2026-09-11','2026-09-24','2026-10-12','2026-12-08','2026-12-25','2026-12-26']
  };
  // The open-data endpoints only give dates, not names, so each festiu is
  // named here: fixed-date ones by month-day, the movable Easter ones from
  // that year's Easter Sunday. Anything unknown still gets a generic label.
  const festiusLocals = new Set(['2026-05-25','2026-09-24']);
  const NOMS_FESTIUS_FIXOS = {
    '01-01':"Cap d'Any",
    '01-06':'Reis',
    '05-01':'Festa del Treball',
    '06-24':'Sant Joan',
    '08-15':"L'Assumpció",
    '09-11':'Diada Nacional de Catalunya',
    '09-24':'La Mercè',
    '10-12':"Festa Nacional d'Espanya",
    '11-01':'Tots Sants',
    '12-06':'Dia de la Constitució',
    '12-08':'La Immaculada',
    '12-25':'Nadal',
    '12-26':'Sant Esteve'
  };
  function diumengePasqua(year){
    // Anonymous Gregorian algorithm (Meeus/Jones/Butcher)
    const a = year % 19, b = Math.floor(year/100), c = year % 100;
    const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
    const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
    const i = Math.floor(c/4), k = c % 4, l = (32+2*e+2*i-h-k) % 7;
    const m = Math.floor((a+11*h+22*l)/451);
    const mes = Math.floor((h+l-7*m+114)/31), dia = ((h+l-7*m+114) % 31) + 1;
    return new Date(year, mes-1, dia);
  }
  function isoLocal(dt){
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }
  function nomFestiu(iso){
    const year = +iso.slice(0,4);
    const pasqua = diumengePasqua(year);
    const desplacat = n => { const t = new Date(pasqua); t.setDate(t.getDate()+n); return isoLocal(t); };
    const mobils = {
      [desplacat(-2)]:'Divendres Sant',
      [desplacat(1)]:'Dilluns de Pasqua Florida',
      [desplacat(50)]:'Dilluns de Pasqua Granada'
    };
    const nom = mobils[iso] || NOMS_FESTIUS_FIXOS[iso.slice(5)] || (festiusLocals.has(iso) ? 'Festa local' : 'Festiu');
    const tipus = festiusLocals.has(iso) ? 'Festa local de Barcelona'
      : festiusEnDiumenge.has(iso) ? 'Festiu · cau en diumenge'
      : 'Festiu a Catalunya';
    return { nom, tipus };
  }

  function carregaFestius(year){
    const catalunyaUrl = `https://analisi.transparenciacatalunya.cat/resource/yf2b-mjr6.json?any_calendari=${year}&localitzaci=Catalunya`;
    const localUrl = `https://analisi.transparenciacatalunya.cat/resource/b4eh-r8up.json?ajuntament_o_nucli_municipal=Barcelona&any_calendari=${year}`;
    return Promise.all([
      fetch(catalunyaUrl).then(r => r.ok ? r.json() : Promise.reject(new Error('http'))),
      fetch(localUrl).then(r => r.ok ? r.json() : Promise.reject(new Error('http')))
    ]).then(([catalunya, local]) => {
      const set = new Set();
      catalunya.forEach(row => { if(row.data) set.add(row.data.slice(0,10)); });
      local.forEach(row => { if(row.data){ const d = row.data.slice(0,10); set.add(d); festiusLocals.add(d); } });
      if(set.size === 0) throw new Error('buit');
      return set;
    }).catch(() => new Set(FESTIUS_FALLBACK[year] || festiusCalculats(year)));
  }
  // Offline fallback for years not embedded above: the usual Catalan
  // festius plus Barcelona's two local ones, from fixed dates and Easter.
  function festiusCalculats(year){
    const fixos = ['01-01','01-06','05-01','06-24','08-15','09-11','10-12','11-01','12-06','12-08','12-25','12-26'];
    const set = new Set(fixos.map(md => `${year}-${md}`));
    const pasqua = diumengePasqua(year);
    const desplacat = n => { const t = new Date(pasqua); t.setDate(t.getDate()+n); return isoLocal(t); };
    set.add(desplacat(-2)); set.add(desplacat(1));
    const granada = desplacat(50), merce = `${year}-09-24`;
    set.add(granada); set.add(merce);
    festiusLocals.add(granada); festiusLocals.add(merce);
    return set;
  }
  // The official working calendar leaves out festivals that fall on a
  // Sunday (e.g. Tots Sants 2026); they're still festivals, so add them back.
  const festiusEnDiumenge = new Set();
  const cacheFestius = {};
  function festiusAny(year){
    if(!cacheFestius[year]) cacheFestius[year] = carregaFestius(year).then(set => {
      Object.keys(NOMS_FESTIUS_FIXOS).forEach(md => {
        const iso = `${year}-${md}`;
        const [y,m,d] = iso.split('-').map(Number);
        if(!set.has(iso) && new Date(y, m-1, d).getDay() === 0){
          set.add(iso);
          festiusEnDiumenge.add(iso);
        }
      });
      return set;
    });
    return cacheFestius[year];
  }

  let calDesplacament = 0;   // months away from the current one, unlimited
  function buildCalendar(){
    const now = new Date();
    const vista = new Date(now.getFullYear(), now.getMonth() + calDesplacament, 1);
    const year = vista.getFullYear();
    const month = vista.getMonth();
    // "today" ring only on the current month
    const today = calDesplacament === 0 ? now.getDate() : -1;

    const header = document.getElementById('calHeader');
    header.textContent = `${monthNames[month]} ${year}`;
    header.title = calDesplacament !== 0 ? 'Doble toc: torna al mes actual' : '';
    const botoAvui = document.getElementById('calAvui');
    if(botoAvui) botoAvui.classList.toggle('amagat', calDesplacament === 0);

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    dow.forEach(d=>{
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(year, month, 1);
    // JS getDay(): 0=Sunday..6=Saturday; convert to Monday-first index (0=Mon..6=Sun)
    let startIdx = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month+1, 0).getDate();

    for(let i=0;i<startIdx;i++){
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      el.textContent = '.';
      grid.appendChild(el);
    }
    for(let d=1; d<=daysInMonth; d++){
      const el = document.createElement('div');
      const dow0 = new Date(year, month, d).getDay(); // 0=Sun..6=Sat
      let cls = 'cal-day';
      if(d === today) cls += ' today';
      if(dow0 === 0 || dow0 === 6) cls += ' weekend';
      el.className = cls;
      el.textContent = d;
      el.dataset.date = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      grid.appendChild(el);
    }
    // always 6 week rows, so swiping between months never changes the card's height
    for(let i = startIdx + daysInMonth; i < 42; i++){
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      el.textContent = '.';
      grid.appendChild(el);
    }

    festiusAny(year).then(festius => {
      grid.querySelectorAll('.cal-day[data-date]').forEach(el => {
        if(festius.has(el.dataset.date)) el.classList.add('holiday');
      });
    });

    // Holiday name bubble: one per grid, re-created with it.
    const pop = document.createElement('div');
    pop.className = 'cal-festa-pop';
    pop.setAttribute('role','status');
    pop.innerHTML = '<span class="nom"></span><span class="tipus"></span>';
    grid.appendChild(pop);
  }
  buildCalendar();

  // Tap a festiu -> show its name; tap the same day again (or anywhere
  // else) -> hide it; tap another festiu -> move the bubble there.
  (function festiuPopup(){
    const grid = document.getElementById('calGrid');
    let obert = null;
    function tanca(){
      const pop = grid.querySelector('.cal-festa-pop');
      if(pop) pop.classList.remove('visible');
      if(obert) obert.classList.remove('selected');
      obert = null;
    }
    function obre(cell){
      const pop = grid.querySelector('.cal-festa-pop');
      if(!pop) return;
      const info = nomFestiu(cell.dataset.date);
      pop.querySelector('.nom').textContent = info.nom;
      pop.querySelector('.tipus').textContent = info.tipus;
      pop.classList.remove('sota');
      // measure first, then place above the day (or below it if there's no room)
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      const cx = cell.offsetLeft + cell.offsetWidth/2;
      let left = Math.max(0, Math.min(grid.clientWidth - pw, cx - pw/2));
      let top = cell.offsetTop - ph - 8;
      const card = document.getElementById('calendarCard');
      const espaiDalt = cell.getBoundingClientRect().top - (card ? card.getBoundingClientRect().top : 0);
      if(espaiDalt < ph + 14){
        top = cell.offsetTop + cell.offsetHeight + 8;
        pop.classList.add('sota');
      }
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      pop.style.setProperty('--punta-x', Math.max(10, Math.min(pw-10, cx-left)) + 'px');
      if(obert) obert.classList.remove('selected');
      obert = cell;
      cell.classList.add('selected');
      pop.classList.add('visible');
    }
    grid.addEventListener('click', e => {
      const cell = e.target.closest('.cal-day.holiday');
      if(!cell){ tanca(); return; }
      if(cell === obert) tanca(); else obre(cell);
    });
    document.addEventListener('click', e => {
      if(obert && !grid.contains(e.target)) tanca();
    });
    window.__tancaFestiu = tanca;
  })();

  // ---- Swipe the calendar left/right: next / previous month, limited to
  // with no limit either way; the "Torna a avui" button, a double tap on
  // the month name or the Home key jump back to the current month. ----
  (function lliscaCalendari(){
    const card = document.getElementById('calendarCard');
    const header = document.getElementById('calHeader');
    const grid = document.getElementById('calGrid');
    if(!card) return;
    let x0 = null, y0 = null, acabaDeLliscar = false, animant = false;

    function canviaMes(pas){
      const nou = calDesplacament + pas;
      if(pas === 0 || animant) return;
      animant = true;
      if(window.__tancaFestiu) window.__tancaFestiu();
      const surt = pas > 0 ? 'fora-esq' : 'fora-dre';
      const entra = pas > 0 ? 'fora-dre' : 'fora-esq';
      [header, grid].forEach(el => el.classList.add(surt));
      setTimeout(() => {
        calDesplacament = nou;
        buildCalendar();
        [header, grid].forEach(el => { el.classList.add('lliscant'); el.classList.remove(surt); el.classList.add(entra); });
        void grid.offsetWidth;
        [header, grid].forEach(el => { el.classList.remove('lliscant'); el.classList.remove(entra); });
        setTimeout(() => { animant = false; }, 200);
      }, 180);
    }

    card.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; });
    card.addEventListener('pointerup', e => {
      if(x0 === null) return;
      const dx = e.clientX - x0, dy = e.clientY - y0;
      x0 = y0 = null;
      if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3){
        acabaDeLliscar = true;
        setTimeout(() => { acabaDeLliscar = false; }, 350);
        canviaMes(dx < 0 ? 1 : -1);
      }
    });
    card.addEventListener('pointercancel', () => { x0 = y0 = null; });
    // a swipe must not also count as a tap on a festiu
    card.addEventListener('click', e => {
      if(acabaDeLliscar){ e.stopPropagation(); e.preventDefault(); }
    }, true);
    const tornaAvui = () => { if(calDesplacament !== 0) canviaMes(-calDesplacament); };
    const botoAvui = document.getElementById('calAvui');
    if(botoAvui) botoAvui.addEventListener('click', tornaAvui);
    // double tap / double click on the month name (touch devices don't
    // reliably fire dblclick, so time two taps ourselves)
    let darrerToc = 0;
    header.addEventListener('click', () => {
      const ara = Date.now();
      if(ara - darrerToc < 400){ darrerToc = 0; tornaAvui(); }
      else darrerToc = ara;
    });
    // keyboard on desktop
    document.addEventListener('keydown', e => {
      if(e.key === 'ArrowRight') canviaMes(1);
      else if(e.key === 'ArrowLeft') canviaMes(-1);
      else if(e.key === 'Home') tornaAvui();
    });
  })();

  // ---- Hourly flip: watch turns over for ~10s to reveal the engraved back,
  // with the cuckoo call playing in sync, then returns to the dial ----
  const watchWrapEl = document.querySelector('.watch-wrap');
  const watchFlip = document.getElementById('watchFlip');
  const watchFlipWrap = document.getElementById('watchFlipWrap');
  const cucutUnit = document.getElementById('cucutUnit');
  const campanaUnit = document.getElementById('campanaUnit');
  const unlockPing = document.getElementById('unlockPing');

  // ---- Build the "edge" as a real stack of thin discs, not a single flat
  // one. A single flat layer goes edge-on (invisible) at the very same
  // moment the front/back faces do, leaving a see-through gap mid-spin.
  // Stacking many slightly-offset layers along Z keeps something angled
  // toward the camera at every point of the turn, reading as a solid rim. ----
  (function generaVolumCilindreWatch(){
    const contenidor = document.getElementById('cosCilindreWatch');
    if(!contenidor) return;
    const totalCapes = 24;
    const gruixTotal = 38; // slightly under 2x the face translateZ (40px), avoids z-fighting
    for(let i = 0; i < totalCapes; i++){
      const capa = document.createElement('div');
      capa.className = 'capa-volum-watch';
      const zPos = -gruixTotal/2 + (i * (gruixTotal / (totalCapes - 1)));
      capa.style.transform = `translateZ(${zPos.toFixed(2)}px)`;
      contenidor.appendChild(capa);
    }
  })();

  // Same technique, sized for the thin dial-swap flip (Omega <-> GAMA)
  // instead of the whole watch body.
  (function generaVolumCilindreDial(){
    const contenidor = document.getElementById('dialCilindre');
    if(!contenidor) return;
    const totalCapes = 18;
    const gruixTotal = 14;
    for(let i = 0; i < totalCapes; i++){
      const capa = document.createElement('div');
      capa.className = 'capa-volum-dial';
      const zPos = -gruixTotal/2 + (i * (gruixTotal / (totalCapes - 1)));
      capa.style.transform = `translateZ(${zPos.toFixed(2)}px)`;
      // Relief + reflection: a black cylinder edge whose specular sheen
      // peaks on the layers nearest z=0 (the "equator" that faces the
      // viewer square-on as the dial turns) and fades to near-black at
      // the two flanks (z=+-gruixTotal/2), so the turn reads as a curved
      // glossy black rim catching the light, not a flat grey strip.
      // Colours are kept fully OPAQUE (no alpha) on purpose: with 18
      // overlapping 3D layers, translucent white stops would compound
      // through simple alpha stacking into a blown-out white sphere at
      // the edge-on midpoint of the turn - opaque colour interpolation
      // avoids that entirely.
      const t = i / (totalCapes - 1);
      const curve = Math.sin(t * Math.PI);
      const hlR = Math.round(8 + curve * 92);
      const hlG = Math.round(8 + curve * 92);
      const hlB = Math.round(9 + curve * 96);
      const midR = Math.round(hlR * 0.3), midG = Math.round(hlG * 0.3), midB = Math.round(hlB * 0.3);
      capa.style.background = `radial-gradient(circle at 30% 24%, rgb(${hlR},${hlG},${hlB}) 0%, rgb(${midR},${midG},${midB}) 20%, #060606 42%, #000 78%)`;
      capa.style.boxShadow = `inset 0 0 ${(3 + curve * 5).toFixed(1)}px rgba(0,0,0,.9)`;
      contenidor.appendChild(capa);
    }
  })();

  // Force a true square (largest that fits), mirroring how the old plain
  // <svg> used to letterbox itself inside a non-square flex box.
  function fitWatchSquare(){
    const rect = watchWrapEl.getBoundingClientRect();
    const size = Math.max(0, Math.min(rect.width, rect.height));
    if(size > 0){
      watchFlipWrap.style.width = size + 'px';
      watchFlipWrap.style.height = size + 'px';
    }
  }
  fitWatchSquare();
  window.addEventListener('resize', fitWatchSquare);
  window.addEventListener('orientationchange', () => setTimeout(fitWatchSquare, 60));
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', fitWatchSquare);
  }
  let audioUnlocked = false;
  let girant = false;

  // ---- Tap the dial to flip between the Omega face and the GAMA replica --
  // Independent of the hourly front/back turn (which only ever shows the
  // engraved plate on the back): this flips the FRONT face's own content in
  // place, so the hourly reveal is untouched either way. Guarded so a tap
  // mid-hour-chime doesn't compound with that other rotation.
  const dialFlip = document.getElementById('dialFlip');
  if(dialFlip){
    watchFlip.addEventListener('click', () => {
      if(girant) return;
      const showingGama = dialFlip.classList.toggle('mostra-gama');
      // Same pushers, same shape — just recoloured to each watch's own
      // chromatism (green for the Omega, red/black for the GAMA replica).
      watchFlipWrap.classList.toggle('mode-gama', showingGama);
      // Ease the pushers outward for the turn, exactly like the hourly
      // flip does, so the dial's edge never looks like it's cutting
      // straight through solid buttons mid-rotation.
      cronoStartBtn.classList.add('pusher-retreat');
      cronoSplitBtn.classList.add('pusher-retreat');
      setTimeout(() => {
        cronoStartBtn.classList.remove('pusher-retreat');
        cronoSplitBtn.classList.remove('pusher-retreat');
      }, 2500);
    });
  }

  // ---- Mechanical "cloc" (synthesized, no audio file) --------------------
  // Same technique as the Orloj index: a short lowpass-filtered noise burst
  // (the "clic" of a latch) plus a triangle-wave thump sweeping 180Hz->60Hz
  // (the "clonc" of the mechanism settling), played together. Marks the
  // instant the turn stops and the dial is facing forward again.
  let audioCtx = null;
  function obtenirAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ return null; }
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume().catch(() => {}); }
    return audioCtx;
  }
  function reproduirCloc(){
    const ctx = obtenirAudioCtx();
    if(!ctx) return;
    const quan = ctx.currentTime;
    const midaBufer = Math.max(1, Math.floor(ctx.sampleRate * 0.015));
    const buffer = ctx.createBuffer(1, midaBufer, ctx.sampleRate);
    const dades = buffer.getChannelData(0);
    for(let i = 0; i < midaBufer; i++){
      dades[i] = (Math.random()*2-1) * Math.pow(1 - i/midaBufer, 1.5);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filtre = ctx.createBiquadFilter();
    filtre.type = 'lowpass';
    filtre.frequency.value = 1800;
    const gainClic = ctx.createGain();
    gainClic.gain.value = 0.5;
    src.connect(filtre);
    filtre.connect(gainClic);
    gainClic.connect(ctx.destination);
    src.start(quan);
    src.stop(quan + 0.02);

    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, quan);
    osc.frequency.exponentialRampToValueAtTime(60, quan + 0.12);
    const gainThump = ctx.createGain();
    gainThump.gain.setValueAtTime(0.0001, quan);
    gainThump.gain.linearRampToValueAtTime(0.5, quan + 0.008);
    gainThump.gain.exponentialRampToValueAtTime(0.0008, quan + 0.22);
    osc.connect(gainThump);
    gainThump.connect(ctx.destination);
    osc.start(quan);
    osc.stop(quan + 0.25);
  }

  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    obtenirAudioCtx();
    unlockPing.play().catch(() => {});
    ensureBuffersDecoded();
  }
  document.addEventListener('pointerdown', unlockAudio, { once:true, passive:true });

  // iOS Safari silently re-suspends the AudioContext whenever the page is
  // backgrounded (screen locked, app switched away, tab hidden) — and once
  // that happens, resuming it from a plain setTimeout (like the on-the-hour
  // trigger below) is unreliable there, since WebKit only fully honours a
  // resume() made in direct response to a user gesture. Rather than unlock
  // once and hope it stays unlocked for the next chime, every subsequent
  // tap anywhere on the page — and the moment the tab becomes visible again
  // — re-arms it, so the odds it's actually running when the hour hits are
  // as high as possible.
  function reactivarAudio(){ obtenirAudioCtx(); }
  document.addEventListener('pointerdown', reactivarAudio, { passive:true });
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') reactivarAudio();
  });

  // ---- Cuckoo+bell striking sequence, joined into one continuous phrase --
  // The source file's cuckoo+bell isn't two clean separate hits with a gap;
  // it reads as one continuous harmonic thread. To get that here with only
  // a short sampled cuckoo call and a short sampled bell attack, each bell
  // is extended with a synthesized resonant tail (plain decaying sine
  // partials, like a real bell's overtones) that rings on past the sample
  // itself; the NEXT cuckoo's entrance is then faded in while that tail is
  // still audibly decaying, so the two cross-fade into each other instead
  // of the sequence sounding like separate stuttering clips.
  const PARELL_ESPAI = 0.85;    // seconds between the start of each pair
  const CAMPANA_RETARD = 0.28;  // seconds after the cuckoo that the bell follows
  const CUA_RESSO = CAMPANA_RETARD + 0.16; // when the bell's ringing tail begins
  const CUA_FINAL = 1.0;        // seconds the last strike's tail is left to ring out
  const GUANY_CUCUT = 1.0;      // cuckoo: the lead voice, at full level
  const GUANY_CAMPANA = 0.22;   // bell attack sample: well underneath the cuckoo, softened
  const GUANY_RESSO = 0.035;    // bell's synthesized ring-out: a faint wash, not a second lead
  const CAMPANA_LOWPASS = 3200; // tames the sample's bright/harsh top end

  let cucutBuffer = null, campanaBuffer = null, buffersReady = null;
  function ensureBuffersDecoded(){
    const ctx = obtenirAudioCtx();
    if(!ctx) return Promise.resolve(false);
    if(cucutBuffer && campanaBuffer) return Promise.resolve(true);
    if(buffersReady) return buffersReady;
    buffersReady = Promise.all([
      fetch(cucutUnit.currentSrc || cucutUnit.src).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b)),
      fetch(campanaUnit.currentSrc || campanaUnit.src).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b))
    ]).then(([cb, pb]) => { cucutBuffer = cb; campanaBuffer = pb; return true; })
      .catch(err => {
        console.warn('Rellotge: no s\'han pogut preparar els sons', err);
        buffersReady = null; // let the next attempt (next tap, next hour) retry instead of staying silent forever
        return false;
      });
    return buffersReady;
  }

  function playBuffer(buffer, ctxTime, fadeInSec, peakGain, lowpassHz){
    const ctx = obtenirAudioCtx();
    if(!ctx || !buffer) return;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const g = ctx.createGain();
    let lastNode = src;
    if(lowpassHz){
      // Extra safety net against a bright/harsh top end on the bell sample,
      // independent of how the source file itself was mastered.
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = lowpassHz;
      src.connect(lp);
      lastNode = lp;
    }
    lastNode.connect(g);
    g.connect(ctx.destination);
    const fi = Math.max(0.004, fadeInSec || 0.01);
    const peak = peakGain == null ? 1 : peakGain;
    g.gain.setValueAtTime(0.0001, ctxTime);
    g.gain.linearRampToValueAtTime(peak, ctxTime + fi);
    src.start(ctxTime);
    src.stop(ctxTime + buffer.duration + 0.05);
  }

  // Synthesized bell resonance: a few decaying sine partials (a simple
  // harmonic stack, like a small bell's overtones) standing in for the
  // sample's own ring-out, so its length and fade are fully under our
  // control regardless of how short the sampled attack is.
  function playBellTail(ctxTime, durSec, peakGain){
    const ctx = obtenirAudioCtx();
    if(!ctx) return;
    const partials = [ {freq:540, mul:1}, {freq:812, mul:0.55}, {freq:1084, mul:0.25} ];
    partials.forEach(p => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = p.freq;
      const g = ctx.createGain();
      const peak = (peakGain || 0.11) * p.mul;
      g.gain.setValueAtTime(0.0001, ctxTime);
      g.gain.linearRampToValueAtTime(peak, ctxTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0006, ctxTime + Math.max(0.1, durSec));
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(ctxTime);
      osc.stop(ctxTime + Math.max(0.1, durSec) + 0.05);
    });
  }

  function playChimeSequence(n){
    ensureBuffersDecoded().then(ok => {
      const ctx = obtenirAudioCtx();
      if(!ctx) return;
      const t0 = ctx.currentTime + 0.03;
      for(let i = 0; i < n; i++){
        const pairStart = t0 + i * PARELL_ESPAI;
        const isLast = (i === n - 1);
        // Cuckoo: a quick clean attack for the very first call, but a soft
        // emerging fade-in for every later one, timed to land while the
        // previous bell's tail is still ringing underneath it.
        if(ok && cucutBuffer) playBuffer(cucutBuffer, pairStart, i === 0 ? 0.02 : 0.14, GUANY_CUCUT);
        if(ok && campanaBuffer) playBuffer(campanaBuffer, pairStart + CAMPANA_RETARD, 0.006, GUANY_CAMPANA, CAMPANA_LOWPASS);
        const tailDur = isLast ? CUA_FINAL : (PARELL_ESPAI - CUA_RESSO + 0.18);
        playBellTail(pairStart + CUA_RESSO, tailDur, GUANY_RESSO);
      }
    });
  }

  function chimeSpanSeconds(n){
    if(n <= 0) return 0;
    return (n - 1) * PARELL_ESPAI + CUA_RESSO + CUA_FINAL;
  }

  // How long the pushers retreat outward before the dial actually starts
  // turning, so the withdrawal reads as leading the flip rather than
  // coinciding with it.
  const PUSHER_PRELUDE_MS = 380;

  function triggerFlip(n){
    if(girant) return;
    girant = true;
    // Give the turn enough time to hold on the back face for every strike to
    // be heard: a short minimum for a low count, more for a full 12.
    const durSec = Math.max(6, chimeSpanSeconds(n) + 1.5);
    watchFlip.style.setProperty('--gir-dur', durSec.toFixed(2) + 's');

    // Pushers ease outward a touch first, then the dial turns.
    cronoStartBtn.classList.add('pusher-retreat');
    cronoSplitBtn.classList.add('pusher-retreat');

    setTimeout(() => {
      watchFlip.classList.remove('girant');
      void watchFlip.offsetWidth; // restart animation
      watchFlip.classList.add('girant');
      playChimeSequence(n);
    }, PUSHER_PRELUDE_MS);
  }
  watchFlip.addEventListener('animationend', () => {
    girant = false;
    reproduirCloc();
    cronoStartBtn.classList.remove('pusher-retreat');
    cronoSplitBtn.classList.remove('pusher-retreat');
  });

  // Schedule the automatic flip for each exact hour change: strikes the
  // watch's own hour count (1-12, both for am and pm) in cuckoo+bell pairs.
  function scheduleNextHourFlip(){
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours()+1, 0, 0, 50);
    const delay = next.getTime() - now.getTime();
    setTimeout(() => {
      const h12 = next.getHours() % 12;
      const compteHora = h12 === 0 ? 12 : h12;
      triggerFlip(compteHora);
      scheduleNextHourFlip();
    }, delay);
  }
  scheduleNextHourFlip();
})();
</script>
</body>
</html>
